<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanTech Prospector — Pipeline en direct</title>
<style>
  :root{
    --bg:#0a0e16; --panel:#121a27; --panel2:#0e1420; --line:#1e2838; --ink:#e6ecf5;
    --mut:#8091a8; --blue:#3b82f6; --cyan:#22d3ee; --green:#22c55e; --amber:#f59e0b;
    --red:#ef4444; --violet:#a78bfa; --pink:#ec4899; --teal:#14b8a6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 60% -10%,#14203300,#0a0e16),var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--cyan);text-decoration:none}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(180deg,#16202f,#0e1420);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .bar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}
  .bar h1 span{color:var(--cyan)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
  .dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:pp 1.6s infinite}
  @keyframes pp{50%{opacity:.4}}
  .pill{font-size:11px;padding:4px 10px;border-radius:20px;background:#1b2534;border:1px solid var(--line);color:var(--mut)}
  .pill.ok{color:var(--green);border-color:#1e3a2a}.pill.warn{color:var(--amber);border-color:#3a2f1a}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#1b2534;color:var(--ink);padding:7px 14px;border-radius:8px}
  button:hover{border-color:var(--blue)}
  button.primary{background:var(--blue);border-color:var(--blue);font-weight:600}
  button.warn{background:#3a2f1a;border-color:#5a4a20;color:var(--amber)}
  .wrap{padding:16px 20px;max-width:1560px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .card h2{font-size:13px;margin:0;padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;color:#cdd9ea}
  .card h2 .cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400}

  /* ---------- PIPELINE FLOW ---------- */
  .flowcard{background:linear-gradient(180deg,#0f1826,#0b111c);border:1px solid var(--line);border-radius:16px;padding:6px 10px 12px}
  .flowhead{display:flex;align-items:center;gap:10px;padding:10px 10px 4px}
  .flowhead b{font-size:15px}.flowhead .leg{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--mut)}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  svg.flow{width:100%;height:auto;display:block}
  .node rect{transition:filter .25s, stroke .25s}
  .node .big{font-weight:800;font-size:22px}
  .node .lab{font-size:12.5px;font-weight:700}
  .node .sub{font-size:10px;fill:var(--mut)}
  .node.flash rect{filter:drop-shadow(0 0 10px currentColor) brightness(1.25)}
  .edge{stroke:#28374d;stroke-width:2;fill:none}
  .elabel{font-size:10px;fill:#63758f}
  .scorepop{font-size:16px;font-weight:800;opacity:0}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:4px 0 16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
  .kpi .n{font-size:25px;font-weight:800}.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .kpi.b .n{color:var(--cyan)}.kpi.g .n{color:var(--green)}.kpi.v .n{color:var(--violet)}.kpi.a .n{color:var(--amber)}.kpi.p .n{color:var(--pink)}

  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
  .feed{max-height:420px;overflow:auto}
  .ev{display:flex;gap:10px;padding:9px 15px;border-bottom:1px solid #161f2c;font-size:13px;align-items:flex-start}
  .ev:hover{background:var(--panel2)}
  .tag{flex:none;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;margin-top:1px}
  .t-SOURCED{background:#1b2a3f;color:#7db3ff}.t-ENRICHED{background:#132c2a;color:#5ee0c8}
  .t-QUALIFIED{background:#12301d;color:#5bd77f}.t-REJECTED{background:#2f1a1a;color:#ff8a8a}
  .t-SENT{background:#251b3a;color:#c0a6ff}.t-FOLLOWUP{background:#2a2540;color:#b9a8f0}
  .t-REPLIED{background:#3a2540;color:#f5a8d8}.t-OPTOUT,.t-BOUNCED,.t-ERROR{background:#2a2020;color:#e0a0a0}
  .t-log{background:#1a2230;color:#8aa}.t-scraper{background:#132433;color:#6cc8e6}
  .ev .m{flex:1;min-width:0}.ev .m b{color:var(--ink)}.ev .m .s{color:var(--mut);font-size:12px}
  .ev .ti{flex:none;color:#546}.ev .score{flex:none;font-weight:800}
  .sc-hi{color:var(--green)}.sc-mid{color:var(--amber)}.sc-lo{color:var(--red)}
  .emails{max-height:420px;overflow:auto}
  .em{padding:11px 15px;border-bottom:1px solid #161f2c;cursor:pointer}.em:hover{background:var(--panel2)}
  .em .top{display:flex;gap:8px;align-items:center}
  .em .k{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#251b3a;color:#c0a6ff}
  .em .k.relance{background:#2a2540;color:#b9a8f0}
  .em .subj{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .em .to{font-size:12px;color:var(--mut);margin-top:2px}
  .em .body{display:none;white-space:pre-wrap;margin-top:9px;padding:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:13px;color:#cdd9ea}
  .em.open .body{display:block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 12px;color:var(--mut);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  td{padding:9px 12px;border-bottom:1px solid #161f2c}tr:hover td{background:var(--panel2)}
  .st{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
  .toolbar{display:flex;gap:8px;padding:10px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  input,select{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px}
  .mini{font-size:11px;padding:3px 8px}.tbl-wrap{max-height:440px;overflow:auto}.muted{color:var(--mut)}
</style>
</head>
<body>
<div class="bar">
  <div class="dot" id="live"></div>
  <h1>Clean<span>Tech</span> Prospector</h1>
  <span class="pill" id="mailer">SMTP…</span>
  <span class="pill" id="modePill"></span>
  <div class="spacer"></div>
  <button class="primary" onclick="scrape()">⚡ Scraper maintenant</button>
  <button id="pauseBtn" class="warn" onclick="togglePause()">⏸️ Pause envois</button>
</div>

<div class="wrap">

  <!-- ================= PIPELINE EN DIRECT ================= -->
  <div class="flowcard">
    <div class="flowhead">
      <b>🧬 Pipeline de décision — en direct</b>
      <span class="muted" style="font-size:12px">chaque particule = un lead qui avance ; la couleur = la direction choisie par l'IA</span>
      <div class="leg">
        <span><i style="background:#3b82f6"></i>flux principal</span>
        <span><i style="background:#22c55e"></i>accepté</span>
        <span><i style="background:#ef4444"></i>rejeté / sans suite</span>
        <span><i style="background:#ec4899"></i>réponse 🎉</span>
      </div>
    </div>
    <svg class="flow" id="flow" viewBox="0 0 1120 470" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <h2>📜 Journal des décisions <span class="cnt" id="feedCnt">0</span></h2>
      <div class="feed" id="feed"></div>
    </div>
    <div class="card">
      <h2>📧 Emails envoyés <span class="cnt" id="emCnt">0</span></h2>
      <div class="emails" id="emails"></div>
    </div>
  </div>

  <div class="card">
    <h2>🎯 Leads</h2>
    <div class="toolbar">
      <input id="q" placeholder="Rechercher nom / ville / email…" oninput="loadLeads()">
      <select id="statusFilter" onchange="loadLeads()">
        <option value="">Tous les statuts</option>
        <option>QUALIFIED</option><option>CONTACTED</option><option>FOLLOWUP_1</option>
        <option>EXHAUSTED</option><option>REPLIED</option><option>ENRICHED</option>
        <option>NEW</option><option>NO_EMAIL</option><option>REJECTED</option>
      </select>
      <span class="muted" id="leadCnt" style="align-self:center"></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Entreprise</th><th>Secteur</th><th>Ville</th><th>Score</th><th>Email</th><th>Statut</th><th></th></tr></thead>
        <tbody id="leads"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = (s)=>document.querySelector(s);
const esc = (s)=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const scCls = (n)=>n>=75?'sc-hi':n>=55?'sc-mid':'sc-lo';

/* ---------- Définition du schéma ---------- */
const NW=158, NH=66;
const NODES = {
  SOURCE:  {x:20,  y:40,  lab:'Sourcing',   sub:'recherche web / Places', ic:'🔎', col:'#22c55e', status:'NEW'},
  ENRICH:  {x:238, y:40,  lab:'Scraping',   sub:'navigateur furtif',      ic:'🕷️', col:'#14b8a6', status:'ENRICHED'},
  QUALIFY: {x:456, y:40,  lab:'Qualif. IA', sub:'Claude · score 0-100',   ic:'🧠', col:'#3b82f6', status:'QUALIFIED'},
  COMPOSE: {x:674, y:40,  lab:'Rédaction',  sub:'Claude · email perso',   ic:'✍️', col:'#a78bfa', status:null,   statusToday:'SENT'},
  SEND:    {x:892, y:40,  lab:'Envoi',      sub:'Gmail SMTP',             ic:'📧', col:'#8b5cf6', status:'CONTACTED'},
  NOEMAIL: {x:238, y:210, lab:'Sans email', sub:'à appeler',              ic:'📵', col:'#8091a8', status:'NO_EMAIL'},
  REJECT:  {x:456, y:210, lab:'Rejeté',     sub:'hors cible',             ic:'⛔', col:'#ef4444', status:'REJECTED'},
  FOLLOW:  {x:892, y:210, lab:'Relances',   sub:'J+3 · J+7',              ic:'🔁', col:'#f59e0b', status:'FOLLOWUP_1', statusExtra:'EXHAUSTED'},
  SUPPRESS:{x:674, y:210, lab:'Exclu',      sub:'opt-out / bounce',       ic:'🚫', col:'#6b7280', status:'OPTOUT', statusExtra:'BOUNCED'},
  REPLIED: {x:892, y:360, lab:'Réponse',    sub:'à conclure',             ic:'🎉', col:'#ec4899', status:'REPLIED'},
};
const EDGES = [
  ['e1','SOURCE','ENRICH','R','L','#3b82f6'],
  ['e2','ENRICH','QUALIFY','R','L','#3b82f6'],
  ['e3','QUALIFY','COMPOSE','R','L','#22c55e'],
  ['e4','COMPOSE','SEND','R','L','#a78bfa'],
  ['e5','ENRICH','NOEMAIL','B','T','#6b7280'],
  ['e6','QUALIFY','REJECT','B','T','#ef4444'],
  ['e7','SEND','FOLLOW','B','T','#f59e0b'],
  ['e8','FOLLOW','REPLIED','B','T','#ec4899'],
  ['e9','SEND','SUPPRESS','B','T','#6b7280'],
];
function anchor(n,side){const N=NODES[n];switch(side){
  case 'R':return [N.x+NW,N.y+NH/2];case 'L':return [N.x,N.y+NH/2];
  case 'B':return [N.x+NW/2,N.y+NH];case 'T':return [N.x+NW/2,N.y];}}
function pathD(a,b){
  const [x1,y1]=a,[x2,y2]=b;
  if(Math.abs(y1-y2)<2) return `M${x1},${y1} L${x2},${y2}`;        // horizontal
  if(Math.abs(x1-x2)<2) return `M${x1},${y1} L${x2},${y2}`;        // vertical
  const my=(y1+y2)/2;                                              // elbow courbe
  return `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
}

function buildFlow(){
  const svg=$('#flow');
  const NS='http://www.w3.org/2000/svg';
  let edgesG='', nodesG='';
  // arrow marker
  edgesG += `<defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#3a4a63"/></marker></defs>`;
  for(const [id,from,to,fs,ts,col] of EDGES){
    const d=pathD(anchor(from,fs),anchor(to,ts));
    edgesG += `<path id="${id}" class="edge" d="${d}" marker-end="url(#arw)"/>`;
  }
  for(const [k,N] of Object.entries(NODES)){
    nodesG += `<g class="node" id="n-${k}" style="color:${N.col}">
      <rect x="${N.x}" y="${N.y}" width="${NW}" height="${NH}" rx="12" fill="#0f1826" stroke="${N.col}" stroke-opacity=".55" stroke-width="1.5"/>
      <text x="${N.x+14}" y="${N.y+26}" class="lab" fill="#e6ecf5">${N.ic} ${N.lab}</text>
      <text x="${N.x+14}" y="${N.y+44}" class="sub">${N.sub}</text>
      <text x="${N.x+NW-14}" y="${N.y+45}" text-anchor="end" class="big" id="c-${k}" fill="${N.col}">0</text>
      <text x="${N.x+NW/2}" y="${N.y-8}" text-anchor="middle" class="scorepop" id="pop-${k}" fill="${N.col}"></text>
    </g>`;
  }
  svg.innerHTML = edgesG + nodesG;
}

/* ---------- Animation d'une particule le long d'une flèche ---------- */
function firePacket(edgeId,color){
  const path=document.getElementById(edgeId); if(!path) return;
  const len=path.getTotalLength();
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('r','5'); c.setAttribute('fill',color);
  c.setAttribute('filter','drop-shadow(0 0 6px '+color+')');
  $('#flow').appendChild(c);
  const dur=950; const t0=performance.now();
  (function step(now){
    const t=Math.min(1,(now-t0)/dur);
    const p=path.getPointAtLength(t*len);
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y);
    c.setAttribute('opacity', t<.1? t*10 : t>.85? (1-t)/.15 : 1);
    if(t<1) requestAnimationFrame(step); else c.remove();
  })(t0);
}
function flashNode(k){const g=document.getElementById('n-'+k);if(!g)return;g.classList.add('flash');setTimeout(()=>g.classList.remove('flash'),450);}
function popScore(k,txt){const t=document.getElementById('pop-'+k);if(!t)return;t.textContent=txt;t.style.transition='none';t.style.opacity='1';t.setAttribute('y',NODES[k].y-8);
  requestAnimationFrame(()=>{t.style.transition='opacity 1.4s, transform 1.4s';t.style.opacity='0';t.setAttribute('y',NODES[k].y-24);});}

/* map d'un événement -> arête + nœud destination */
function animateEvent(e){
  if(e.kind==='event'){
    const T=e.type;
    if(T==='SOURCED'){ firePacket('e1','#3b82f6'); flashNode('ENRICH'); }
    else if(T==='ENRICHED'){ if(/aucun email/i.test(e.detail||'')){firePacket('e5','#6b7280');flashNode('NOEMAIL');} else {firePacket('e2','#3b82f6');flashNode('QUALIFY');} }
    else if(T==='QUALIFIED'){ firePacket('e3','#22c55e'); flashNode('COMPOSE'); }
    else if(T==='REJECTED'){ firePacket('e6','#ef4444'); flashNode('REJECT'); }
    else if(T==='SENT'){ firePacket('e4','#a78bfa'); flashNode('SEND'); }
    else if(T==='FOLLOWUP'){ firePacket('e7','#f59e0b'); flashNode('FOLLOW'); }
    else if(T==='REPLIED'){ firePacket('e8','#ec4899'); flashNode('REPLIED'); }
    else if(T==='OPTOUT'||T==='BOUNCED'){ firePacket('e9','#6b7280'); flashNode('SUPPRESS'); }
  } else if(e.kind==='qualify'){
    popScore('QUALIFY', (e.decision==='accept'?'✔ ':'✘ ')+e.score);
    flashNode('QUALIFY');
  } else if(e.kind==='email'){
    flashNode('SEND');
  }
}

/* ---------- Journal ---------- */
let feedN=0;
function addFeed(e){
  const feed=$('#feed'); let tag,main,extra='';
  if(e.kind==='qualify'){ tag=e.decision==='accept'?'QUALIFIED':'REJECTED';
    main=`<b>${esc(e.name)}</b> <span class="s">· ${esc(e.sector)} · ${esc(e.city)}</span><br><span class="s">${esc(e.reason)}</span>`;
    extra=`<div class="score ${scCls(e.score)}">${e.score}</div>`;
  } else if(e.kind==='email'){ tag='SENT'; main=`<b>📧 ${esc(e.name)}</b> <span class="s">· ${esc(e.kind)}</span><br><span class="s">« ${esc(e.subject)} » → ${esc(e.to)}</span>`;
  } else if(e.kind==='event'){ tag=e.type; const nm=e.lead?`<b>${esc(e.lead.name)}</b> `:''; main=`${nm}<span class="s">${esc(e.detail||'')}</span>`;
  } else if(e.kind==='scraper'){ tag='scraper'; main=`<span class="s">🕷️ ${esc(e.msg)}</span>`;
  } else if(e.kind==='log'){ if(e.level!=='error'&&!/Sourcing|démarré|cycle|Dashboard/i.test(e.msg)) return; tag='log'; main=`<span class="s">${esc(e.msg)}</span>`;
  } else if(e.kind==='mail_dryrun'){ tag='SENT'; main=`<span class="s">🧪 (simulation) ${esc(e.subject)} → ${esc(e.to)}</span>`;
  } else return;
  const row=document.createElement('div'); row.className='ev';
  const ti=new Date(e.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  row.innerHTML=`<span class="tag t-${(tag||'log').replace('_1','')}">${tag}</span><div class="m">${main}</div>${extra}<span class="ti">${ti}</span>`;
  feed.prepend(row); while(feed.children.length>200) feed.lastChild.remove();
  $('#feedCnt').textContent=(++feedN);
}

/* ---------- SSE ---------- */
function connect(){
  const es=new EventSource('/api/stream');
  es.onopen=()=>$('#live').classList.add('on');
  es.onerror=()=>$('#live').classList.remove('on');
  es.onmessage=(m)=>{ try{ const e=JSON.parse(m.data); animateEvent(e); addFeed(e);
    if(e.kind==='email'||e.kind==='qualify'||e.kind==='event'){ refreshStats(); if(e.kind==='email') loadEmails(); }
  }catch{} };
}

const stColor={QUALIFIED:'#12301d;color:#5bd77f',CONTACTED:'#251b3a;color:#c0a6ff',FOLLOWUP_1:'#2a2540;color:#b9a8f0',
  EXHAUSTED:'#20283a;color:#8ea',REPLIED:'#3a2540;color:#f5a8d8',REJECTED:'#2f1a1a;color:#ff8a8a',
  ENRICHED:'#132c2a;color:#5ee0c8',NEW:'#1b2a3f;color:#7db3ff',NO_EMAIL:'#262020;color:#c0a0a0',
  OPTOUT:'#2a2020;color:#e0a0a0',BOUNCED:'#2a2020;color:#e0a0a0'};

async function refreshStats(){
  const s=await fetch('/api/stats').then(r=>r.json());
  const t=s.today||{}, c=s.counts||{};
  const kpi=(cls,n,l)=>`<div class="kpi ${cls}"><div class="n">${n||0}</div><div class="l">${l}</div></div>`;
  $('#kpis').innerHTML=kpi('b',t.SOURCED,'Sourcés (jour)')+kpi('',t.ENRICHED,'Emails trouvés')+
    kpi('g',t.QUALIFIED,'Qualifiés IA')+kpi('v',t.SENT,`Cold emails (${s.sentTodayNew||0}/${s.quotas.newPerDay})`)+
    kpi('a',t.FOLLOWUP,'Relances')+kpi('p',c.REPLIED,'Réponses 🎉');
  // compteurs des nœuds du schéma
  for(const [k,N] of Object.entries(NODES)){
    let v=0;
    if(N.status) v+=c[N.status]||0;
    if(N.statusExtra) v+=c[N.statusExtra]||0;
    if(N.statusToday) v+=t[N.statusToday]||0;
    const el=document.getElementById('c-'+k); if(el) el.textContent=v;
  }
  const m=s.mailer||{};
  $('#mailer').textContent=(m.ok?'✅ ':'⚠️ ')+(m.mode||''); $('#mailer').className='pill '+(m.ok?'ok':'warn');
  $('#modePill').textContent=s.dryRun?'🧪 DRY_RUN (simulation)':(s.paused?'⏸️ En pause':'▶️ Actif');
  $('#modePill').className='pill '+(s.dryRun||s.paused?'warn':'ok');
  $('#pauseBtn').textContent=s.paused?'▶️ Reprendre':'⏸️ Pause envois'; window._paused=s.paused;
}

async function loadEmails(){
  const rows=await fetch('/api/emails').then(r=>r.json());
  $('#emCnt').textContent=rows.length;
  $('#emails').innerHTML=rows.map(e=>`<div class="em" onclick="this.classList.toggle('open')">
    <div class="top"><span class="k ${/relance/.test(e.kind)?'relance':''}">${esc(e.kind)}</span><span class="subj">${esc(e.subject)}</span></div>
    <div class="to">${esc(e.to_name)} &lt;${esc(e.to_email)}&gt; · ${esc(e.sector||'')} · ${esc(e.city||'')} ${e.score?'· score '+e.score:''}</div>
    <div class="body">${esc(e.body)}</div></div>`).join('')||'<div class="em muted">Aucun email envoyé pour l’instant.</div>';
}
async function loadLeads(){
  const q=$('#q').value, st=$('#statusFilter').value;
  const rows=await fetch(`/api/leads?q=${encodeURIComponent(q)}&status=${st}`).then(r=>r.json());
  $('#leadCnt').textContent=rows.length+' leads';
  $('#leads').innerHTML=rows.map(l=>`<tr>
    <td>${l.website?`<a href="${esc(l.website)}" target="_blank">${esc(l.name)}</a>`:esc(l.name)}</td>
    <td class="muted">${esc(l.sector_label||'')}</td><td>${esc(l.city||'')}</td>
    <td>${l.score!=null?`<b class="${scCls(l.score)}">${l.score}</b>`:'<span class="muted">—</span>'}</td>
    <td class="muted">${esc(l.email||'—')}</td>
    <td><span class="st" style="background:${stColor[l.status]||'#222'}">${l.status}</span></td>
    <td>${['CONTACTED','FOLLOWUP_1','EXHAUSTED'].includes(l.status)?
      `<button class="mini" onclick="mark(${l.id},'replied')">✅ Réponse</button> <button class="mini" onclick="mark(${l.id},'optout')">🚫 STOP</button>`:''}</td></tr>`).join('');
}
async function mark(id,action){await fetch('/api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});loadLeads();refreshStats();}
async function scrape(){await fetch('/api/scrape',{method:'POST'});}
async function togglePause(){await fetch('/api/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paused:!window._paused})});refreshStats();}

buildFlow(); connect(); refreshStats(); loadEmails(); loadLeads();
setInterval(refreshStats,6000); setInterval(loadLeads,15000);
</script>
</body>
</html>
